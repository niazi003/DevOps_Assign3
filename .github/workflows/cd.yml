name: CD Pipeline

on:
  push:
    branches:
      - [cite_start]develop  # Trigger: Merge into 'develop' branch [cite: 34]

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    [cite_start]environment: development
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          [cite_start]username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-assign3:latest 

      - name: Trigger Render Deployment
        run: |
          curl -X POST ${{ secrets.RENDER_CALLBACK_URL }} 
